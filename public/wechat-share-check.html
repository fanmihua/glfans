<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>glfans · 微信分享检测</title>
<style>body{margin:0;padding:24px;font:16px/1.7 system-ui,sans-serif;background:#f7f7f4;color:#111}main{max-width:620px;margin:auto}h1{font-size:25px}li{margin:12px 0;overflow-wrap:anywhere}.bad{color:#b00036}.ok{color:#18713c}button{padding:12px 20px;border:0;background:#111;color:white;font-size:16px}small{color:#555}</style></head>
<body><main><h1>微信分享检测</h1><p>请在微信内打开本页。检测结束后，把结果截图发给我；无需填写账号或密钥。</p><ol id="result" aria-live="polite"></ol><button onclick="location.reload()">重新检测</button><p><small>本页不上传检测日志，不显示签名、令牌或密钥。分享测试使用网站 Logo 和 EmiBonnie 页面。</small></p></main>
<script>
const list=document.getElementById('result');
function log(message,kind=''){const row=document.createElement('li');row.textContent=message;row.className=kind;list.appendChild(row);}
function safeMessage(error){return String(error?.errMsg||error?.message||'未返回错误说明').slice(0,240);}
async function run(){
 if(!/MicroMessenger/i.test(navigator.userAgent)){log('当前不是微信内置浏览器，请将本页链接发到微信，再从微信打开。','bad');return;}
 log('已识别微信内置浏览器。','ok');
 const url=location.href.split('#')[0];
 try{
  const response=await fetch('/api/wechat/jssdk-signature?url='+encodeURIComponent(url));
  const sig=await response.json();
  if(!response.ok){log('服务器签名失败：'+(sig.error?.code||response.status),'bad');return;}
  log('服务器签名成功；公众号 AppID 尾号：'+String(sig.appId).slice(-6),'ok');
  const metadata=await fetch('/cp/emibonnie/share.json').then(r=>{if(!r.ok)throw Error('分享资料读取失败');return r.json();});
  await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://res.wx.qq.com/open/js/jweixin-1.6.0.js';const timer=setTimeout(()=>reject(Error('微信 SDK 下载超时')),15000);s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=()=>{clearTimeout(timer);reject(Error('微信 SDK 下载失败'));};document.head.appendChild(s);});
  if(!window.wx)throw Error('微信 SDK 未初始化');
  log('微信 SDK 已加载。','ok');
  let failed=false,answered=false;
  const timer=setTimeout(()=>{if(!answered)log('微信配置 15 秒未返回结果。','bad');},15000);
  wx.error(error=>{failed=true;answered=true;clearTimeout(timer);log('微信配置拒绝：'+safeMessage(error),'bad');});
  wx.config({...sig,debug:false,jsApiList:['updateAppMessageShareData','updateTimelineShareData','onMenuShareAppMessage','onMenuShareTimeline']});
  wx.ready(()=>{
   if(failed)return;answered=true;clearTimeout(timer);log('微信配置回调已到达，继续核对分享接口权限。');
   const share={title:metadata.title,desc:metadata.description,imgUrl:metadata.image,link:metadata.url};
   let registered=false;
   setTimeout(()=>{if(!registered)log('发送给朋友接口未返回确认，请将目前的结果截图发给我。','bad');},10000);
   wx.updateAppMessageShareData({...share,success:()=>{registered=true;log('发送给朋友：微信已确认分享资料。现在请点右上角“发送给朋友”，核对卡片。','ok');},fail:error=>{registered=true;log('发送给朋友被拒绝：'+safeMessage(error),'bad');}});
   wx.updateTimelineShareData({...share,success:()=>log('朋友圈分享资料已确认。','ok'),fail:error=>log('朋友圈被拒绝：'+safeMessage(error),'bad')});
   wx.onMenuShareAppMessage({...share,fail:error=>log('兼容分享接口被拒绝：'+safeMessage(error),'bad')});
  });
 }catch(error){log(safeMessage(error),'bad');}
}
run();
</script></body></html>
